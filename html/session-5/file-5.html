<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>File 5</title>
</head>
<body>

    <!-- Header -->
    <header>
        <nav>
            <strong>Flipkart</strong>

            <form>
                <input type="search" placeholder="Search for products">
                <button type="submit">Search</button>
            </form>

            <span>
                <a href="#">Login</a>
                <a href="#">Cart</a>
            </span>
        </nav>
    </header>

    <!-- Main Content -->
    <main>

        <!-- Sidebar -->
        <aside>
            <h2>Filters</h2>

            <section>
                <h3>Category</h3>
                <label>
                    <input type="checkbox"> Electronics
                </label><br>

                <label>
                    <input type="checkbox"> Clothing
                </label><br>

            </section>

            <section>
                <h3>Price</h3>
                <label>
                    <input type="radio" name="price"> Under ₹500
                </label><br>

                <label>
                    <input type="radio" name="price"> ₹500 - ₹1000
                </label><br>

                <label>
                    <input type="radio" name="price"> Above ₹1000
                </label>
            </section>
        </aside>

        <!-- Product Listing -->
        <section>
            <header>
                <h1>Products</h1>
                <p>Showing popular products</p>
            </header>

            <section class="products">

                <!-- Product 1 -->
                <article>

                    <h2>Wireless Headphones</h2>

                    <img src="images/headphones.jpg" alt="Wireless Headphones">

                    <p>Bluetooth wireless headphones with clear sound.</p>

                    <p>₹999</p>

                    <button>Add to Cart</button>
                </article>

                <!-- Product 2 -->
                <article>

                    <h2>Smartphone</h2>

                    <img src="images/phone.jpg" alt="Smartphone">

                    <p>Latest smartphone with a powerful processor.</p>

                    <p>₹14,999</p>

                    <button>Add to Cart</button>
                </article>

            </section>
        </section>

    </main>

    <!-- Footer -->
    <footer>
        <p>&copy; 2026 Flipkart</p>
    </footer>



</body>
</html>
