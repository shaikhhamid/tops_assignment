<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Feedback Form for a Bovie Booking Site</title>
</head>
<body>
    <h2>Feedback Form for a Movie Booking Site</h2>

    <form>
        <table border="1">
            <tr>
                <th>Experience</th>
            </tr>
            <tr>
                <td>
                    <input type="radio" name="" id="">1
                    <input type="radio" name="" id="">2
                    <input type="radio" name="" id="">3
                    <input type="radio" name="" id="">4
                    <input type="radio" name="" id="">5
                </td>
            </tr>
            <tr>
                <th>Features</th>
                <tr>
                    <td>
                        <input type="checkbox" name="" id="">Seat Selection
                        <input type="checkbox" name="" id="">Food Order
                        <input type="checkbox" name="" id="">Payment
                    </td>
                </tr>
            </tr>
            <tr>
                <td><input type="submit" value="Submit"></td>
            </tr>
        </table>
    </form>
</body>
</html>
