<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Email Form Validation</title>
</head>
<body>
    <h2>Email Validation Form</h2>
    <form method="post">
        <table border="1">
            <tr>
                <th>Email</th>
                <td><input type="email" name="" id="" pattern="[a-zA-Z0-9._%+-]+@gmail\.com" required></td>
            </tr>
            <tr>
                <td><input type="submit" value="Submit"></td>
            </tr>
        </table>
    </form>
</body>
</html>
